name: validation

# Validation — daily while a case is active: GEE catalog OPERA validation and
# SWOT Hydrocron series as a table asset, without an OPERA Earthdata fetch.
# The job itself decides activeness and exits 0 when no case is active (L8a).

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validation
  cancel-in-progress: false

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: GCP credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${GCP_SA_KEY:-}" ]; then
            echo "$GCP_SA_KEY" > /tmp/sa.json
            gcloud auth activate-service-account --key-file=/tmp/sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json" >> "$GITHUB_ENV"
          else
            echo "::warning::GCP_SA_KEY secret is not set"
          fi

      - name: Validate Earthdata token
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: uv run python -c "from live.fetch import check_earthdata_token; check_earthdata_token()"

      - name: Run validation job (GEE OPERA + SWOT)
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GEE_PROJECT: ${{ vars.GEE_PROJECT }}
        run: uv run python live/jobs.py validation

      - name: Detect data/ artifacts
        id: data_changed
        run: |
          if [ -n "$(git status --porcelain -- data/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish data/ to Neon storage
        if: steps.data_changed.outputs.changed == 'true'
        env:
          NEON_S3_ENDPOINT: ${{ secrets.NEON_S3_ENDPOINT }}
          NEON_S3_ACCESS_KEY_ID: ${{ secrets.NEON_S3_ACCESS_KEY_ID }}
          NEON_S3_SECRET_ACCESS_KEY: ${{ secrets.NEON_S3_SECRET_ACCESS_KEY }}
          NEON_S3_REGION: ${{ secrets.NEON_S3_REGION }}
          NEON_S3_BUCKET: ${{ secrets.NEON_S3_BUCKET }}
        run: bash live/publish_s3.sh

      - name: Publish data/ to fallback branch
        if: steps.data_changed.outputs.changed == 'true'
        run: uv run python live/publish_fallback.py

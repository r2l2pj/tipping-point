name: modo-agora

# Modo Agora — keeps the GEE now/ assets current every 3 h (L8: GEE assets are
# the source of truth; the job also exports the last-good static fallback).
# On failure the previous commit of data/ stays live.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: now
  cancel-in-progress: false

jobs:
  now:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: GCP credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${GCP_SA_KEY:-}" ]; then
            echo "$GCP_SA_KEY" > /tmp/sa.json
            gcloud auth activate-service-account --key-file=/tmp/sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json" >> "$GITHUB_ENV"
          else
            echo "::warning::GCP_SA_KEY secret is not set"
          fi

      - name: Validate Earthdata token
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: uv run python -c "from live.fetch import check_earthdata_token; check_earthdata_token()"

      - name: Run now job (IMERG Early + SMAP L4 + GEOS-FP -> GEE now/ assets)
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GEE_PROJECT: ${{ vars.GEE_PROJECT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python live/jobs.py now

      - name: Publish data/ to fallback branch
        run: uv run python live/publish_fallback.py

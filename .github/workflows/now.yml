name: modo-agora

# Modo Agora — refreshes data/now every 3 h (L20/L25: local TPI from
# IMERG Early + SMAP L4 + GFS, no GEE at runtime; L26: GitHub 'fallback'
# branch is the primary data host, Neon best-effort secondary).
# On failure the previous fallback snapshot stays live.

on:
  schedule:
    # :17 past, not :00: GitHub drops top-of-hour schedules under load
    # (the 03:00Z run on 2026-11-15 never fired). 00:17, 03:17 ... UTC.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: now
  cancel-in-progress: false

jobs:
  now:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: GCP credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${GCP_SA_KEY:-}" ]; then
            echo "$GCP_SA_KEY" > /tmp/sa.json
            gcloud auth activate-service-account --key-file=/tmp/sa.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json" >> "$GITHUB_ENV"
          else
            echo "::warning::GCP_SA_KEY secret is not set"
          fi

      - name: Validate Earthdata token
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: uv run python -c "from live.fetch import check_earthdata_token; check_earthdata_token()"

      # Static model inputs for the response steps (R1-R3): served from the
      # static-v1 Release, cached so CI downloads them at most once.
      - name: Cache static response inputs
        uses: actions/cache@v4
        with:
          path: |
            data/now/static/gpw/gpw_popcount_2020_30sec.tif
            data/now/static/mcd12q1/lc_type1_2025.tif
            data/now/static/jrc_gsw/gsw_occurrence_2021.tif
            data/now/static/jrc_gsw/gsw_seasonality_2021.tif
            data/static/south_brazil/terrain/hand_m.tif
            data/now/static/ibge/municipalities_now.geojson
            data/static/south_brazil/terrain/hand_90m.tif
            data/now/static/nasadem/steep15_1as.tif
          key: static-v1-response-4

      - name: Fetch static response inputs (cache miss only, sha256-checked)
        run: |
          set -euo pipefail
          rel="https://github.com/r2l2pj/tipping-point-data/releases/download/static-v1"
          get() {  # asset dest sha256
            if [ ! -s "$2" ]; then
              mkdir -p "$(dirname "$2")"
              curl -fsSL --retry 3 -o "$2" "$rel/$1"
            fi
            echo "$3  $2" | sha256sum -c -
          }
          get gpw_popcount_2020_30sec.tif data/now/static/gpw/gpw_popcount_2020_30sec.tif 76dea7254b5b83147b9791fd2017df73ae8fb511eadaf00701b7dfa94dcbc203
          get lc_type1_2025.tif data/now/static/mcd12q1/lc_type1_2025.tif 5606cd09ecf8ca00df62c1e9b39a89a5e1c4a9595c8f853555e324c497a1b68b
          get gsw_occurrence_2021.tif data/now/static/jrc_gsw/gsw_occurrence_2021.tif a31b98c96856b1541b7a998bbbbcc00326d6bb61cdb8055245199d3ac9cf3c04
          get gsw_seasonality_2021.tif data/now/static/jrc_gsw/gsw_seasonality_2021.tif 30cda153f75a687afd2421ef05337a5f392931a575431377bcf3ead65215c307
          get hand_m.tif data/static/south_brazil/terrain/hand_m.tif 5445278f146e65dca6cfae21bf6d31a97dbaf79cac3fb8230a22eb39635a993d
          # IBGE API is unreachable from GitHub runners: static copy
          get municipalities_now.geojson data/now/static/ibge/municipalities_now.geojson 7a003eb3aac3e52985152134c32bd4a35398ae015e8c58a220a7fb1593b33d1f
          # R2 90 m HAND (falls back to hand_m.tif) and R4 steep-slope mask
          get hand_90m.tif data/static/south_brazil/terrain/hand_90m.tif 40bc5963e6fc2d727364f8b198837402098c965d545345c478705fd2c5f7bca1
          get steep15_1as.tif data/now/static/nasadem/steep15_1as.tif 32bab1f708743854997773bef0d345f9fbaa2eee63fd20074c46ad9dc29711c9

      # R1 rolling state ("changed since last pass"): restore the newest
      # snapshot, save a new one after R1 (cache entries are immutable).
      - name: Restore R1 DSWx state
        uses: actions/cache/restore@v4
        with:
          path: data/now/response/dswx_state.npz
          key: dswx-state-${{ github.run_id }}
          restore-keys: dswx-state-

      # alerts fire only on class UPGRADES vs the previous run, so the
      # previous run's classes must survive the fresh checkout
      # v2 (2026-11-15): baselines saved before the IMERG 2x fix / by paused
      # runs are discarded
      - name: Restore previous alert classes
        uses: actions/cache/restore@v4
        with:
          path: data/now/prev_classes.npz
          key: prev-classes-v2-${{ github.run_id }}
          restore-keys: prev-classes-v2-

      # L30-clim: whole-year IMERG 0.1 deg climatology (~20-25 MB, static-v1
      # Release asset). static_fetch downloads it into this path on a miss;
      # actions/cache keeps it so CI fetches it at most once per key.
      - name: Cache climatology (clim_imerg_0p1.tif)
        uses: actions/cache@v4
        with:
          path: data/static/south_brazil/clim/clim_imerg_0p1.tif
          key: clim-imerg-0p1-v1

      # L20: local TPI path — run_now --local fetches IMERG Early / SMAP L4 /
      # GEOS-FP, computes TPI in numpy against per-doy climatology + terrain
      # pulled from the GEE assets, writes data/now directly. No EE raster
      # ingest (loadGeoTIFF requires gs://), so the GEE asset path stays off.
      - name: Run now job (IMERG Early + SMAP L4 + GEOS-FP -> local TPI -> data/now)
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GEE_PROJECT: ${{ vars.GEE_PROJECT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NOW_LOCAL: "1"
        run: uv run python live/jobs.py now

      - name: Save alert classes
        uses: actions/cache/save@v4
        with:
          path: data/now/prev_classes.npz
          key: prev-classes-v2-${{ github.run_id }}
        continue-on-error: true

      # L27 response side (lead-analysis scripts), in order after the TPI
      # job. Additive: a failure here never blocks the TPI publish; the
      # finalize step only declares products whose files exist.
      - name: R1 flood candidates (OPERA DSWx-S1)
        continue-on-error: true
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          PYTHONPATH: pipeline
        run: |
          if [ -f pipeline/scripts/13_response_dswx.py ]; then
            uv run python pipeline/scripts/13_response_dswx.py
          else echo "::notice::R1 script not on this branch yet"; fi

      - name: Save R1 DSWx state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/now/response/dswx_state.npz
          key: dswx-state-${{ github.run_id }}
        continue-on-error: true

      - name: R2 radar flood candidates (NISAR GCOV)
        continue-on-error: true
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          PYTHONPATH: pipeline
        run: |
          if [ -f pipeline/scripts/14_response_nisar.py ]; then
            uv run python pipeline/scripts/14_response_nisar.py
          else echo "::notice::R2 script not on this branch yet"; fi

      - name: R3 response summary + priority zones
        continue-on-error: true
        env:
          PYTHONPATH: pipeline
        run: |
          if [ -f pipeline/scripts/15_response_summary.py ]; then
            uv run python pipeline/scripts/15_response_summary.py
          else echo "::notice::R3 script not on this branch yet"; fi

      - name: R4 landslide scar candidates (OPERA DIST-ALERT-HLS)
        continue-on-error: true
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          PYTHONPATH: pipeline
        run: |
          if [ -f pipeline/scripts/16_response_dist.py ]; then
            uv run python pipeline/scripts/16_response_dist.py
          else echo "::notice::R4 script not on this branch yet"; fi

      # L23/L27 P(trigger) frames — OFF until lead-ml's real model + TEST
      # metrics land: enabled only by the repo variable NOW_P_TRIGGER=1.
      - name: P(trigger) frames (lead-ml TriggerModel)
        if: vars.NOW_P_TRIGGER == '1'
        continue-on-error: true
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          NOW_P_TRIGGER: "1"
          PYTHONPATH: pipeline
        run: |
          set -euo pipefail
          rel="https://github.com/r2l2pj/tipping-point-data/releases/download/static-v1"
          mkdir -p ml/models data/static/south_brazil/ml
          get() {  # asset dest sha256 (lead-ml real model, 2026-11-15)
            [ -s "$2" ] || curl -fsSL --retry 3 -o "$2" "$rel/$1"
            echo "$3  $2" | sha256sum -c -
          }
          get p_trigger_xgb.json ml/models/p_trigger_xgb.json 2eba71d66b1939333a4eb6bd42a38ab5320fccd3d08b993ad86437f3044464ed
          get p_trigger_xgb.meta.json ml/models/p_trigger_xgb.meta.json 44df91aa4c6473148a9f5dc1237a8e1b39b68d6f4182bb3459c20c081dce7b07
          get ml_static_now.tif data/static/south_brazil/ml/ml_static_now.tif 721b92280fd6785581c78842056f8cd91a8619af7b26c6c367e16b3459be3612
          uv run python -m live.p_trigger

      - name: Finalize now manifest (merge response node, drop absent products)
        env:
          NOW_P_TRIGGER: ${{ vars.NOW_P_TRIGGER }}
        run: |
          uv run python -m live.now_manifest
          uv run python tools/build_manifest.py

      # queryable mirror of the published JSON (after every producer and
      # manifest, before publish); exits 1 if > 50 MB
      - name: Build sqlite mirror
        continue-on-error: true
        env:
          PYTHONPATH: pipeline
        run: |
          # runs history: start from the published database so its 'runs'
          # table keeps one row per Now run (fallback is a single orphan commit)
          curl -fsSL -o data/tipping_point.sqlite \
            "https://raw.githubusercontent.com/${{ github.repository }}/fallback/data/tipping_point.sqlite" \
            || echo "no previous sqlite on fallback - runs history starts here"
          uv run python tools/build_sqlite.py

      # L26: GitHub 'fallback' branch is the primary data host (one
      # force-pushed orphan snapshot per run, app-facing files only,
      # >50 MB -> release asset). Neon publish is best-effort secondary.
      # Guard (conductor 2026-11-15, fallback race): the publish FAILS and
      # logs DROPPED paths if the snapshot would remove an app-facing file
      # that both the current fallback and main HEAD have. Exception: the
      # R2 NISAR flood geojson, which 15_response_nisar.py deletes by design
      # when no scene covers the window (the manifest prunes the product).
      - name: Publish data/ to fallback branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FALLBACK_ALLOW_DROP: data/now/response/flood_nisar.geojson
        run: uv run python live/publish_fallback.py

      # G1+G2: Telegram subscriber alerts on the just-published bundle —
      # store/Telegram errors are logged inside live.notify, which always
      # exits 0; continue-on-error is belt-and-braces.
      - name: Notify Telegram subscribers
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          APP_URL: https://tipping-point-app.vercel.app
        run: uv run python -m live.notify

      - name: Publish data/ to Neon storage
        continue-on-error: true
        env:
          NEON_S3_ENDPOINT: ${{ secrets.NEON_S3_ENDPOINT }}
          NEON_S3_ACCESS_KEY_ID: ${{ secrets.NEON_S3_ACCESS_KEY_ID }}
          NEON_S3_SECRET_ACCESS_KEY: ${{ secrets.NEON_S3_SECRET_ACCESS_KEY }}
          NEON_S3_REGION: ${{ secrets.NEON_S3_REGION }}
          NEON_S3_BUCKET: ${{ secrets.NEON_S3_BUCKET }}
        run: bash live/publish_s3.sh

name: app-ci

# L53 monorepo: the Next.js app lives in app/ (was tipping-point-app ci.yml).
on:
  push:
    paths: ["app/**", "data/manifest.json", ".github/workflows/app-ci.yml"]
  pull_request:
    paths: ["app/**", "data/manifest.json", ".github/workflows/app-ci.yml"]

defaults:
  run:
    working-directory: app

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test --pass-with-no-tests
      - run: bun run build

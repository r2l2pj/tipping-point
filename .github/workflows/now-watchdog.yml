name: now-watchdog

# Backup trigger for modo-agora (now.yml). GitHub drops scheduled runs under
# load (2026-11-15: one scheduled run fired in 6 h). This second workflow, on
# different minutes, dispatches now.yml with GITHUB_TOKEN when the last
# SUCCESSFUL now run is older than 3.5 h and none is queued or running.
# workflow_dispatch from GITHUB_TOKEN is allowed to start workflow runs.
# The last step FAILS the run when the published data/now/manifest.json on the
# fallback branch is older than 6 h (L13b) — GitHub emails the owner on failed
# runs; that is the stale-data alarm.

on:
  schedule:
    - cron: "41 1-22/3 * * *"
    - cron: "53 2-23/3 * * *"
  workflow_dispatch:
    inputs:
      max_age_s:
        description: "dispatch if the last successful now run is older than this (s)"
        default: "12600"
      stale_after_s:
        description: "fail the run when the published Now manifest is older than this (s)"
        default: "21600"

permissions:
  actions: write
  contents: read

concurrency:
  group: now-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dispatch now.yml if the last success is stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MAX_AGE_S: ${{ inputs.max_age_s || '12600' }}   # 3.5 h
        run: |
          set -euo pipefail
          active=$(gh run list --workflow now.yml --limit 20 --json status \
            -q '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending")] | length')
          if [ "$active" -gt 0 ]; then
            echo "now.yml already queued/running ($active) — nothing to do"; exit 0
          fi
          last=$(gh run list --workflow now.yml --status success --limit 1 \
            --json updatedAt -q '.[0].updatedAt // ""')
          now=$(date -u +%s)
          age=$MAX_AGE_S
          if [ -n "$last" ]; then age=$(( now - $(date -u -d "$last" +%s) )); fi
          echo "last successful now.yml: ${last:-never} (age ${age}s, max ${MAX_AGE_S}s)"
          if [ "$age" -ge "$MAX_AGE_S" ]; then
            gh workflow run now.yml --ref "${{ github.event.repository.default_branch }}"
            echo "::notice::dispatched now.yml (last success ${last:-never})"
          else
            echo "fresh enough — not dispatching"
          fi

      # L13b stale-data alarm: runs AFTER the dispatch step (a dispatch still
      # happens) and fails the job when the published Now manifest on the
      # fallback branch is > 6 h old. Git, not the raw CDN (no propagation
      # lag). The failed run is what emails the owner.
      - name: Fail when the published Now data is stale
        if: always()
        env:
          STALE_AFTER_S: ${{ inputs.stale_after_s || '21600' }}   # 6 h
        run: |
          set -euo pipefail
          git fetch --quiet --depth 1 origin fallback
          git show FETCH_HEAD:data/now/manifest.json | \
            python -m live.staleness --max-age-s "$STALE_AFTER_S"

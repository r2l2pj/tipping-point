[project]
name = "tipping-point-pipeline"
version = "0.1.0"
description = "Tipping Point — NASA data pipeline: NISAR download/processing, flood & landslide masks, validation metrics (Space Apps 2026, Dancing with the SARs)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "earthengine-api>=1.5",
    "earthaccess>=0.14",
    "asf_search>=8",
    "rasterio>=1.4",
    "rioxarray>=0.18",
    "h5py>=3.12",
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.2",
    "xarray>=2025.1",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/tp"]

[tool.ruff]
line-length = 110
target-version = "py311"

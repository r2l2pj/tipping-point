# Tipping Point — shared thresholds (project doc v4, "Exemplo de config.yaml")
# GEE scripts keep a pasted copy (JS cannot read files); Python reads this file.

cases:
  rs_2024:
    aoi: [-52.5, -30.5, -50.5, -29.0]   # oeste, sul, leste, norte
    event_date: 2024-05-02
    window_before_days: 10
    window_after_days: 5
    label_window: [2024-04-27, 2024-05-06]  # ml: positive cells get t inside this window; replay frames = its days
  wa_2025:
    aoi: [-122.6, 47.0, -121.5, 48.5]
    event_date: 2025-12-10
    window_before_days: 10
    window_after_days: 10
  rs_uruguai_2026:
    aoi: [-57.25, -29.85, -56.45, -29.05]   # Uruguaiana-Itaqui Uruguay River corridor
    event_date: 2026-10-12
    window_before_days: 22
    window_after_days: 34

domains:
  now:
    name: south_brazil
    bbox: [-58.0, -34.0, -48.0, -22.5]   # oeste, sul, leste, norte

thresholds:
  rain_percentiles: [90, 95, 99]
  soil_wetness_range: [0.5, 0.9]
  slope_range_deg: [15, 30]
  hand_range_m: [5, 15]
  hand_proxy_radius_m: 1500
  tpi_classes: [0.2, 0.4, 0.6]
  tpi_weights: [0.3333, 0.3333, 0.3334]   # geomean exponents [R,S,T]; uniform = plain (R·S·T)^(1/3)
  flood_db_drop: -3
  water_db_max: -15          # fallback only — prefer per-scene Otsu/KI (ml-sar report)
  coherence_drop: 0.3
  coherence_ref_min: 0.4
  coh_max_elev_m: 600        # snow-line cap for coherence candidates
  hv_drop_db: 2              # high-confidence vote on HV backscatter loss
  bright_rise_db: 3          # bright-flood +dB gate (inundated vegetation/urban)
  mmu_ha: 3                  # minimum mapping unit, hectares
  slope_flood_max_deg: 5     # T_flood = 0 above this slope
  min_blob_pixels: 10

climatology:
  scale: 10            # stored clim_rain p90|p95|p99 are int16 mm*scale
  years: [2001, 2023]  # climatology baseline period
  window_days: 3       # 3-day rain windows
  doy_offset_days: 30  # +-30 d around the reference DOY
  doy_offset_step: 3   # one window every 3 days

seed: 42

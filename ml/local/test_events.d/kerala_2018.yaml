# Kerala, India — August 2018 monsoon landslides.
# Inventory: van Westen 2020, DANS Data Station doi:10.17026/dans-x6c-y7x2 —
# 4,728 landslide initiation points (shapefile inside the dataset zip), compiled
# by Hao et al. (2020, ESSD 12, 2899-2918) from NRSC + GSI inventories plus Google
# Earth interpretation. Points carry no per-point date: the paper puts the peak
# rain and most failures on 14-19 Aug 2018 -> dating=fixed, D=2018-08-16.
# Pre-2021-03-23: no GFS archive -> perfect-forecast (observed IMERG) only.
events:
  - event_id: kerala_2018
    name: "Kerala, India, Aug 2018 monsoon landslides (Hao et al. 2020, DANS inventory)"
    country: IN
    date: 2018-08-16            # peak-rain day; most failures 14-19 Aug (Hao et al. 2020)
    trigger_window: [2018-08-14, 2018-08-19]
    dating: fixed               # inventory has no per-point date
    format: vector              # shapefile inside the dataset zip (zip:// via pyogrio)
    source: "https://phys-techsciences.datastations.nl/api/access/dataset/:persistentId/?persistentId=doi:10.17026/dans-x6c-y7x2"
    max_points: 3000
    citation: "Hao et al. 2020, Earth Syst. Sci. Data 12, 2899-2918, doi:10.5194/essd-12-2899-2020; dataset: van Westen 2020, DANS doi:10.17026/dans-x6c-y7x2"
    license: "CC-BY-4.0"
    notes: "Initiation points (not polygons); undated -> fixed D from the paper. ~17 GLC Kerala reports in the current VAL split are this event -> leak filter (+-3 d, 100 km) must drop them."
    enabled: false

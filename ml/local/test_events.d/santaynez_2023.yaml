# Santa Ynez Mountains (Santa Barbara/Ventura Counties), California — 9 Jan 2023
# atmospheric-river landslides.
# Inventory: Thomas et al. 2025, USGS data release doi:10.5066/P133CHYQ
# (https://www.sciencebase.gov/catalog/item/65e61972d34e5855ff4e6767);
# companion paper Thomas et al. 2025, Geosphere 21 doi:10.1130/GES02856.1.
# LandslideInventory.csv: 12,663 landslide points mapped from aerial photos —
# one row per slide (columns ID,Latitude,Longitude,HillslopeSetting,
# ImagerySource), mostly shallow debris slides that mobilized into debris
# flows, inside and around the 2008 Tea, 2009 Jesusita, 2017 Thomas and 2019
# Cave fire scars. The storm on 9 Jan 2023 (rain the night of 8-9 Jan local)
# produced widespread landsliding; first documented damage that day
# (Montecito-area flooding/slides reported 9 Jan; the release names the storm
# 9 Jan 2023). No per-point date -> dating=fixed.
# Canonical file URL (www.sciencebase.gov is behind a Cloudflare challenge on
# this host — CSV fetched via a fresh Wayback save
# https://web.archive.org/web/20261115140156/https://www.sciencebase.gov/catalog/file/get/65e61972d34e5855ff4e6767?f=__disk__a4%2F3b%2Fdf%2Fa43bdf1b963dc113e9e8b20bc15df93066b40de2):
# https://www.sciencebase.gov/catalog/file/get/65e61972d34e5855ff4e6767?f=__disk__a4%2F3b%2Fdf%2Fa43bdf1b963dc113e9e8b20bc15df93066b40de2
events:
  - event_id: santaynez_2023
    name: "Santa Ynez Mountains CA, 9 Jan 2023 atmospheric-river landslides (USGS P133CHYQ inventory)"
    country: US
    date: 2023-01-09            # the storm day per the data release title
    trigger_window: [2023-01-08, 2023-01-09]   # storm overnight 8-9 Jan local
    dating: fixed               # inventory has no per-point date
    format: csv
    source: "~/.cache/tipping-point-ml/events/santaynez_2023/LandslideInventory.csv"
    lon_field: Longitude
    lat_field: Latitude
    max_points: 3000
    citation: "Thomas, M.A., Lindsay, D.N., Graber, A.P., et al., 2025, Landslide, soil, and vegetation measurements following an atmospheric river storm on January 9, 2023, in the Santa Ynez Mountains, California, USA: U.S. Geological Survey data release doi:10.5066/P133CHYQ; companion paper Thomas et al. 2025, Geosphere 21, doi:10.1130/GES02856.1"
    license: "CC0-1.0"
    notes: "proposed_split: train. GLC leak check (inventory.csv, +-/3 d of trigger_window, 100 km): 0 GLC points. 12,663 inventory rows -> 3,000 points after 90 m dedupe + max_points cap."
    enabled: false

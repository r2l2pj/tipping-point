# NASA COOLR *event* inventories (Landslides/COOLR_Events_Points, manual mapping from imagery).
# Separate layer from COOLR_Reports_Points (the GLC training pull), so unseen by 3b;
# the leak filter still removes any GLC report within +-3 d / 100 km. All post-2021: GFS ok.
# Only event_date + geometry are requested.
events:
  - event_id: saosebastiao_2023
    name: "São Sebastião / north coast of São Paulo, Feb 2023 (NASA COOLR manual inventory)"
    country: BR
    date: 2023-02-19
    trigger_window: [2023-02-18, 2023-02-19]   # rain over the night of Feb 18-19 (local)
    dating: fixed
    format: arcgis
    source: "https://gis.earthdata.nasa.gov/portal/rest/services/Landslides/COOLR_Events_Points/FeatureServer/0/query"
    where: "event_title = 'Manual inventory of landslides in Brazil, 2023-02-19'"
    citation: "NASA COOLR event inventory (doi:10.6084/m9.figshare.26972467)"
    license: "NASA open data"
    enabled: true
